# Lint, test, check the examples, run the end-to-end suite, and on main publish the
# container as :latest.
#
# Every step is a single `make` target, deliberately. A green local `make ci` must
# mean a green pipeline; the one lint failure that ever reached CI on this project
# happened because the pipeline and the Makefile were separate code paths. Tool
# versions are pinned in the Makefile for the same reason.
#
# Image tags:
#
#	:latest          tip of main, moved by the publish job below
#	:main-<sha>      one immutable tag per merge, for rollback and for pinning
#	:vX.Y.Z          a release, published by release.yml on a tag
#
# `latest` therefore means "newest main build", NOT "newest release" - which is why
# release.yml deliberately does not move it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The runner image ships some Go, but the version drifts with the image.
          # Reading go.mod pins it to what the module declares, so CI and a
          # contributor's machine agree, and it wires up the module and build caches
          # keyed on go.sum.
          go-version-file: go.mod
          cache: true

      - run: make tools
      - run: make lint

  test:
    # No dependency on lint: a formatting nit should not hide a failing test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: make test-race
      - run: make cover

      # Actions has no coverage-regex equivalent, so put the number where it is
      # actually visible: on the run summary page.
      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  examples:
    # The examples are the documentation. `validate` runs the real binary over every
    # limiter file; `manifests` schema-checks the Kubernetes ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: make tools
      - run: make validate
      - run: make manifests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forwardlimit-linux-amd64
          path: bin/forwardlimit
          retention-days: 7

  e2e:
    # Builds the image and asserts the documented behaviour through a real Traefik.
    # The assertions live in ./e2e as Go tests, not in this file.
    #
    # Not containerised, unlike the jobs above could be: this one needs the runner's
    # own Docker daemon and Compose, both preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: make e2e

  publish:
    # Only on a merge to main, and only once everything above has passed. `latest`
    # must never point at a build whose quickstart is broken - which is precisely the
    # failure this pipeline caught once already.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, examples, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: the Dockerfile cross-compiles from BUILDPLATFORM via GOARCH, which
      # for a CGO-free binary is both correct and minutes faster than emulating an
      # arm64 toolchain.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # main-<sha> as well as latest, so a bad `latest` can be rolled back to a
          # known-good build without waiting for a release.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:main-${{ github.sha }}
          build-args: |
            VERSION=main-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=forwardlimit
            org.opencontainers.image.description=Rate limiting via Traefik ForwardAuth
            org.opencontainers.image.version=main-${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo '### Published'
            echo '```'
            echo "ghcr.io/${{ github.repository }}:latest"
            echo "ghcr.io/${{ github.repository }}:main-${{ github.sha }}"
            echo '```'
            echo '`latest` tracks main. Pin a `vX.Y.Z` tag in production.'
          } >> "$GITHUB_STEP_SUMMARY"
